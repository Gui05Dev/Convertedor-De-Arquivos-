# Cabeçalhos de segurança. Incluído no server E em todo location que usa add_header:
# no nginx, um add_header dentro de um location descarta TODOS os add_header herdados
# do server — sem repetir este include, os cabeçalhos sumiriam justamente ali.
#
# CSP: a página não busca nada fora desta origem. 'unsafe-inline' em script-src cobre
# o script de tema no <head> do index.html (o bundle do Vite entra por <script src>).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
